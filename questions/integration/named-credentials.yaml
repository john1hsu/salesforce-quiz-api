article: kt:named-credentials
questions:
  - id: named-credentials-001
    status: published
    type: single
    difficulty: easy
    stem: How should an Apex HTTP callout reference a named credential with the API name ERP_API?
    options:
      - {id: a, text: "req.setEndpoint('callout:ERP_API/orders');"}
      - {id: b, text: "req.setEndpoint('namedcredential://ERP_API/orders');"}
      - {id: c, text: "req.setEndpoint(NamedCredential.ERP_API + '/orders');"}
      - {id: d, text: "req.setEndpoint('https://ERP_API/orders'); with a matching remote site setting"}
    answer: [a]
    explanation: >-
      The endpoint uses the callout: scheme followed by the named credential's API name and an optional path,
      with ? before any query string. Salesforce generates the authorization header, and no remote site
      setting is needed for that host.
    exams: [platform-developer-i, platform-integration-architect]
    sources: [s2]
    created: 2026-11-02
    updated: 2026-11-02

  - id: named-credentials-002
    status: published
    type: single
    difficulty: medium
    stem: >-
      In the current named credential model, which component defines the authentication protocol and which
      permission sets or profiles may use it?
    options:
      - {id: a, text: "The named credential"}
      - {id: b, text: "The external credential, through its principals"}
      - {id: c, text: "The remote site setting"}
      - {id: d, text: "The connected app"}
    answer: [b]
    explanation: >-
      Since Winter '23 the named credential holds the endpoint and points to an external credential. The
      external credential defines the protocol (Basic, OAuth 2.0, JWT, AWS Signature v4 and others), and its
      principals are mapped to permission sets or profiles that Salesforce checks before calling out.
    exams: [platform-integration-architect, identity-and-access-management-architect]
    sources: [s1, s3]
    created: 2026-11-02
    updated: 2026-11-02

  - id: named-credentials-003
    status: published
    type: single
    difficulty: medium
    stem: >-
      A team deploys named and external credentials from sandbox to production through a CI/CD pipeline.
      Which step must be planned into the release?
    options:
      - {id: a, text: "Recreate every principal in production with a different name."}
      - {id: b, text: "Populate access tokens and other secrets after deployment through Setup or the Connect API, because secrets can't be packaged."}
      - {id: c, text: "Add a remote site setting for each named credential's host."}
      - {id: d, text: "Change the Apex code to use the production URL."}
    answer: [b]
    explanation: >-
      Access tokens and other secrets can't be packaged, so they must be populated after install or
      deployment. Using the same API name with a different URL per org lets the same Apex deploy everywhere,
      and named credential hosts don't need remote site settings.
    exams: [development-lifecycle-and-deployment-architect, platform-integration-architect]
    sources: [s1, s2]
    created: 2026-11-02
    updated: 2026-11-02
