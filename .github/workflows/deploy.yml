name: Deploy

# Every merge to main deploys to staging, runs the smoke test, then waits for approval
# (configured on the `production` environment) before deploying to prod.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # OIDC to AWS
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  staging:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-stage
        with:
          stage: staging
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-stage
        with:
          stage: prod
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}
